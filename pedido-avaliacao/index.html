<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impulsionador de Avaliações 5 Estrelas — Praia Digital</title>
<meta name="description" content="Mensagens prontas para pedir avaliações aos hóspedes e subir seu ranking no Airbnb e Booking.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:680px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .msg{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:1rem;margin-top:.8rem;white-space:pre-wrap;font-size:.92rem;line-height:1.6;display:none}
  .copy{margin-top:.5rem;padding:.5rem 1rem;border:1px solid #0077B6;background:#fff;color:#0077B6;border-radius:10px;font-weight:700;cursor:pointer;display:none}
  .dica{margin-top:1.2rem;background:#fef9c3;border:1px solid #fde047;border-radius:12px;padding:1rem;font-size:.88rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/area-anfitriao">← Área do Anfitrião</a>
</header>
<main>
  <div class="card">
    <h1>⭐ Impulsionador de Avaliações</h1>
    <p class="sub">Anfitriões que pedem avaliação no momento certo recebem até 3x mais reviews. Gere suas mensagens:</p>
    <label>Nome do hóspede</label><input id="hospede" value="Carlos">
    <label>Momento</label>
    <select id="momento">
      <option value="checkout">No checkout (pedido principal)</option>
      <option value="pos">24h após checkout (lembrete gentil)</option>
      <option value="retribuicao">Hóspede avaliou primeiro (retribuir)</option>
    </select>
    <button onclick="gerar()">Gerar mensagens</button>
    <div class="msg" id="m1"></div>
    <button class="copy" id="c1" onclick="cp('m1','c1')">📋 Copiar mensagem</button>
    <div class="dica">💡 <b>Timing é tudo:</b> peça na saída, quando a experiência está fresca. Combine com a mensagem de boas-vindas do <a href="https://praia.digital/ferramentas" style="color:#854d0e;font-weight:700">Kit do Anfitrião</a>.</div>
  </div>
</main>
<script>
function gerar(){
  var h=document.getElementById('hospede').value, m=document.getElementById('momento').value, txt;
  if(m==='checkout') txt='Olá, '+h+'! Foi um prazer recebê-lo(a). 🌊\n\nSe a estadia foi boa, uma avaliação de 5 estrelas no app ajuda demais o nosso trabalho — leva menos de 1 minuto.\n\nE claro: sua opinião sobre o que melhorar é sempre bem-vinda por aqui também. Volte sempre!';
  else if(m==='pos') txt='Oi, '+h+'! Espero que a volta para casa tenha sido tranquila. 😊\n\nSe puder deixar sua avaliação da estadia, ficamos muito agradecidos — ela ajuda outros viajantes a descobrirem nosso cantinho no litoral.\n\nUm abraço e até a próxima temporada!';
  else txt='Obrigado pela avaliação, '+h+'! ⭐\n\nAcabei de deixar a sua também — foi um hóspede exemplar. As portas estão sempre abertas para você e sua família. Até a próxima!';
  document.getElementById('m1').textContent=txt;
  document.getElementById('m1').style.display='block';
  document.getElementById('c1').style.display='inline-block';
}
function cp(a,b){navigator.clipboard.writeText(document.getElementById(a).textContent);document.getElementById(b).textContent='✅ Copiado!';}
</script>
</body>
</html>
