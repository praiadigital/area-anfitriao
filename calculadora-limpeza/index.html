<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Taxa de Limpeza — Praia Digital</title>
<meta name="description" content="Quanto cobrar de taxa de limpeza no Airbnb sem afastar hóspedes? Base por tamanho do imóvel.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:660px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .linha{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #e2e8f0;font-size:.93rem}
  .destaque{background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;margin-top:.8rem;text-align:center}
  .destaque b{font-size:1.5rem;color:#0369a1;display:block}
  .dica{margin-top:1rem;background:#fef9c3;border:1px solid #fde047;border-radius:12px;padding:1rem;font-size:.88rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/area-anfitriao">← Área do Anfitrião</a>
</header>
<main>
  <div class="card">
    <h1>🧹 Taxa de Limpeza Ideal</h1>
    <p class="sub">Taxa alta demais afasta reservas curtas; baixa demais corrói seu lucro. Ache o equilíbrio.</p>
    <label>Quartos</label><input type="number" id="quartos" value="2" min="0">
    <label>Banheiros</label><input type="number" id="banheiros" value="1" min="1">
    <label>Nível de limpeza</label>
    <select id="nivel"><option value="80">Básica (você mesmo ou equipe simples)</option><option value="120" selected>Profissional padrão</option><option value="180">Premium (roupa de cama lavada fora, amenities)</option></select>
    <label>Sua diária média (R$)</label><input type="number" id="diaria" value="400">
    <button onclick="calc()">Calcular taxa</button>
    <div id="out"></div>
    <div class="dica">⚠️ Regra prática: taxa de limpeza acima de 35% da diária reduz reservas de 1–2 noites. Teste combinações no <a href="https://praia.digital/area-anfitriao/precificador-dinamico/" style="color:#854d0e;font-weight:700">Precificador Dinâmico</a>.</div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function calc(){
  var q=parseFloat(document.getElementById('quartos').value)||0;
  var b=parseFloat(document.getElementById('banheiros').value)||1;
  var nv=parseFloat(document.getElementById('nivel').value);
  var d=parseFloat(document.getElementById('diaria').value)||1;
  var custo=nv + q*25 + (b-1)*20;
  var maxSaudavel=d*0.35;
  var recomendada=Math.min(custo, Math.round(maxSaudavel/5)*5);
  document.getElementById('out').innerHTML=
    '<div class="linha"><span>Custo real da limpeza</span><b>'+fmt(custo)+'</b></div>'+
    '<div class="linha"><span>Teto saudável (35% da diária)</span><b>'+fmt(maxSaudavel)+'</b></div>'+
    '<div class="destaque">Taxa recomendada<b>'+fmt(recomendada)+'</b><small>'+(custo>maxSaudavel?'Absorva '+fmt(custo-recomendada)+' na diária para não perder reservas curtas':'Cobre 100% do custo — está dentro do saudável')+'</small></div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
